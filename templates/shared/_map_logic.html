<!-- Google Maps JavaScript API -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDL9tIA9KW41-K9-n8Arw-u9-THZVlifCU&callback=initMap&loading=async"
    async defer></script>
<script>
    // Google Maps Initialization
    function initMap() {
        // Check if map div exists on this page
        const mapDiv = document.getElementById("map");
        if (!mapDiv) return;

        // Default center: Toronto area (CYTZ / Billy Bishop)
        const defaultCenter = { lat: 43.6275, lng: -79.3962 };

        // Premium dark mode map styling
        const darkModeStyles = [
            { elementType: "geometry", stylers: [{ color: "#1a1a2e" }] },
            { elementType: "labels.text.stroke", stylers: [{ color: "#1a1a2e" }] },
            { elementType: "labels.text.fill", stylers: [{ color: "#b0b0b0" }] },
            {
                featureType: "administrative.locality",
                elementType: "labels.text.fill",
                stylers: [{ color: "#e0e0e0" }],
            },
            {
                featureType: "poi",
                elementType: "labels.text.fill",
                stylers: [{ color: "#b0b0b0" }],
            },
            {
                featureType: "poi.park",
                elementType: "geometry",
                stylers: [{ color: "#263c3f" }],
            },
            {
                featureType: "poi.park",
                elementType: "labels.text.fill",
                stylers: [{ color: "#6b9a76" }],
            },
            {
                featureType: "road",
                elementType: "geometry",
                stylers: [{ color: "#2c2c54" }],
            },
            {
                featureType: "road",
                elementType: "geometry.stroke",
                stylers: [{ color: "#212a37" }],
            },
            {
                featureType: "road",
                elementType: "labels.text.fill",
                stylers: [{ color: "#9ca5b3" }],
            },
            {
                featureType: "road.highway",
                elementType: "geometry",
                stylers: [{ color: "#003366" }],
            },
            {
                featureType: "road.highway",
                elementType: "geometry.stroke",
                stylers: [{ color: "#001f3f" }],
            },
            {
                featureType: "road.highway",
                elementType: "labels.text.fill",
                stylers: [{ color: "#e0e0e0" }],
            },
            {
                featureType: "transit",
                elementType: "geometry",
                stylers: [{ color: "#2f3948" }],
            },
            {
                featureType: "transit.station",
                elementType: "labels.text.fill",
                stylers: [{ color: "#b0b0b0" }],
            },
            {
                featureType: "water",
                elementType: "geometry",
                stylers: [{ color: "#001f3f" }],
            },
            {
                featureType: "water",
                elementType: "labels.text.fill",
                stylers: [{ color: "#4e6d70" }],
            },
        ];

        // Check if dark mode is active
        const isDarkMode = document.documentElement.classList.contains('dark');

        // Initialize map
        const map = new google.maps.Map(mapDiv, {
            zoom: 11,
            center: defaultCenter,
            mapTypeId: "roadmap",
            styles: isDarkMode ? darkModeStyles : [],
            mapTypeControl: true,
            streetViewControl: false,
            fullscreenControl: true,
        });

        // Add test marker for Hamilton (CYHM)
        const testMarker = new google.maps.Marker({
            position: { lat: 43.1605, lng: -79.9349 },
            map: map,
            title: "Test Hangar Location - CYHM",
            icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 10,
                fillColor: "#3B82F6",
                fillOpacity: 1,
                strokeColor: "#FFFFFF",
                strokeWeight: 2,
            },
        });

        testMarker.addListener("click", () => {
            infoWindow.open(map, testMarker);
        });

        // Add dynamic markers from the backend
        if (window.mapMarkers && window.mapMarkers.length > 0) {
            const bounds = new google.maps.LatLngBounds();
            const infoWindow = new google.maps.InfoWindow();

            window.mapMarkers.forEach(markerData => {
                const position = { lat: markerData.lat, lng: markerData.lon };

                const marker = new google.maps.Marker({
                    position: position,
                    map: map,
                    title: markerData.title,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 10,
                        fillColor: markerData.is_premium ? "#F59E0B" : "#3B82F6", // Amber for premium, Blue for others
                        fillOpacity: 1,
                        strokeColor: "#FFFFFF",
                        strokeWeight: 2,
                    },
                });

                marker.addListener("click", () => {
                    infoWindow.setContent(`
                        <div style="padding: 12px; font-family: Inter, sans-serif; min-width: 180px;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                                <h3 style="font-weight: bold; margin: 0; color: #111827; font-size: 16px;">${markerData.title}</h3>
                                <span style="background: #EBF5FF; color: #1E429F; font-size: 10px; font-weight: bold; padding: 2px 6px; rounded: 4px;">${markerData.icao}</span>
                            </div>
                            <div style="font-size: 18px; font-weight: 800; color: #2563EB; margin-bottom: 8px;">${markerData.price}<span style="font-size: 12px; color: #6B7280; font-weight: 400;">${markerData.price_unit || '/mo'}</span></div>
                            <a href="/listing/${markerData.id}" style="display: block; width: 100%; text-align: center; background: #2563EB; color: white; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: bold; text-decoration: none; transition: background 0.2s;">View Details</a>
                        </div>
                    `);
                    infoWindow.open(map, marker);
                });

                bounds.extend(position);
            });

            // ── Mission Corridor Logic (2026 Strategy) ──
            const urlParams = new URLSearchParams(window.location.search);
            const activeMission = urlParams.get('mission');
            const missions = {
                'snowbird': {
                    path: [
                        { lat: 43.1605, lng: -79.9349 }, // CYHM (Hamilton)
                        { lat: 40.6413, lng: -73.7781 }, // KJFK (New York)
                        { lat: 25.7959, lng: -80.2870 }  // KMIA (Miami)
                    ]
                },
                'sunbelt': {
                    path: [
                        { lat: 33.6407, lng: -84.4277 }, // KATL (Atlanta)
                        { lat: 29.9805, lng: -95.3397 }, // KIAH (Houston)
                        { lat: 33.4342, lng: -112.0081 } // KPHX (Phoenix)
                    ]
                },
                'snf': {
                    path: [
                        { lat: 28.0560, lng: -82.0230 }, // KLAL (Lakeland)
                        { lat: 28.5383, lng: -81.3792 }, // KMCO (Orlando)
                        { lat: 27.9506, lng: -82.4572 }  // KTPA (Tampa)
                    ]
                },
                'oshkosh': {
                    path: [
                        { lat: 43.9844, lng: -88.5570 }, // KOSH (Oshkosh)
                        { lat: 42.9472, lng: -87.8967 }, // KMKE (Milwaukee)
                        { lat: 41.9742, lng: -87.9073 }  // KORD (Chicago)
                    ]
                }
            };

            if (activeMission && missions[activeMission]) {
                const missionPath = missions[activeMission].path;
                const polyline = new google.maps.Polyline({
                    path: missionPath,
                    geodesic: true,
                    strokeColor: "#10b981", // Emerald Green
                    strokeOpacity: 0.8,
                    strokeWeight: 4,
                    map: map
                });

                // Auto-fit bounds to the mission path if no listings are present
                if (!window.mapMarkers || window.mapMarkers.length === 0) {
                    const missionBounds = new google.maps.LatLngBounds();
                    missionPath.forEach(pt => missionBounds.extend(pt));
                    map.fitBounds(missionBounds);
                }
            }

            // If multiple markers, auto-zoom to fit them. If one, center it.
            if (window.mapMarkers.length > 1) {
                map.fitBounds(bounds);
            } else if (window.mapMarkers.length === 1) {
                map.setCenter({ lat: window.mapMarkers[0].lat, lng: window.mapMarkers[0].lon });
                map.setZoom(12);
            }
        }
    }

    // Fallback if Google Maps fails to load
    window.addEventListener('load', function () {
        setTimeout(function () {
            const mapDiv = document.getElementById("map");
            if (mapDiv && !mapDiv.firstChild) {
                mapDiv.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; color: white; font-family: Inter, sans-serif; text-align: center; padding: 40px;">
                        <div>
                            <i class="fas fa-map-marked-alt" style="font-size: 48px; margin-bottom: 16px; opacity: 0.8;"></i>
                            <h3 style="font-size: 20px; font-weight: bold; margin-bottom: 8px;">Map Loading...</h3>
                            <p style="font-size: 14px; opacity: 0.9;">If the map doesn't appear, please check your API key configuration.</p>
                        </div>
                    </div>
                `;
            }
        }, 3000);
    });
</script>
