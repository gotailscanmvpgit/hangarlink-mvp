{% extends "base.html" %}
{% block title %}Sign In | HangarLinks{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-md">

        <!-- Card -->
        <div class="rounded-3xl overflow-hidden shadow-2xl border border-white/10 mb-6"
            style="background: rgba(13,17,23,0.95); backdrop-filter: blur(20px);">

            <!-- Header -->
            <div class="px-8 pt-10 pb-6 text-center border-b border-white/8"
                style="background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(16,185,129,0.05));">
                <h1 class="text-3xl font-black text-white mb-2 tracking-tight">Welcome Back</h1>
                <p class="text-slate-400 text-sm font-medium">Clear for arrival. Sign in below.</p>
            </div>

            <!-- Social Login -->
            <div class="px-8 pt-8 space-y-4">
                <a href="{{ url_for('main.google_login') }}" 
                   class="flex items-center justify-center w-full min-h-[52px] rounded-2xl bg-white text-gray-900 text-base font-black hover:bg-gray-50 transition-all shadow-lg active:scale-[0.98] group">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-6 h-6 mr-3" alt="Google">
                    Continue with Google
                </a>
                
                <div class="flex items-center gap-4 py-2">
                    <div class="flex-grow h-px bg-white/10"></div>
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest px-2">or use email</span>
                    <div class="flex-grow h-px bg-white/10"></div>
                </div>
            </div>

            <!-- Form -->
            <form method="POST" class="px-8 pb-8 pt-2 space-y-5">
                <!-- Email -->
                <div>
                    <label for="login-email" class="block text-xs font-black text-emerald-500 mb-2 uppercase tracking-widest">
                        Email Address
                    </label>
                    <input type="email" id="login-email" name="email" required
                        class="block w-full rounded-2xl px-5 py-4 text-white text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all"
                        style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #FAFAFA;"
                        placeholder="pilot@example.com">
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="login-password" class="block text-xs font-black text-emerald-500 uppercase tracking-widest">
                            Password
                        </label>
                        <a href="{{ url_for('main.forgot_password') }}"
                            class="text-[11px] text-slate-500 hover:text-emerald-400 transition-colors font-bold uppercase tracking-tight">
                            Forgot?
                        </a>
                    </div>
                    <input type="password" id="login-password" name="password" required
                        class="block w-full rounded-2xl px-5 py-4 text-white text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all"
                        style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #FAFAFA;"
                        placeholder="••••••••">
                </div>

                <!-- Submit -->
                <button type="submit"
                    class="w-full font-black py-4 rounded-2xl text-white text-base transition-all hover:scale-[1.02] active:scale-[0.98] mt-2 shadow-xl shadow-emerald-500/10"
                    style="background: linear-gradient(135deg,#10b981,#059669);">
                    Sign In
                </button>
            </form>

            <!-- Footer -->
            <div class="px-8 pb-8 text-center border-t border-white/8 pt-6">
                <p class="text-slate-500 text-sm font-medium">
                    New to HangarLinks?
                    <a href="{{ url_for('main.register') }}"
                        class="text-emerald-400 hover:text-emerald-300 font-black transition-colors ml-1">
                        Sign up free
                    </a>
                </p>
            </div>
        </div>

        <!-- Secondary CTA: Owner -->
        <div class="text-center animate-fade-in-up" style="animation-delay: 0.2s;">
            <a href="{{ url_for('main.post_listing') }}" class="inline-flex items-center text-sm font-bold text-platinum-400 hover:text-white transition-all group">
                <span class="w-8 h-px bg-white/10 mr-4 group-hover:w-12 transition-all"></span>
                Rent out your hangar? <span class="text-emerald-400 ml-2">List Your Space</span>
                <span class="w-8 h-px bg-white/10 ml-4 group-hover:w-12 transition-all"></span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
